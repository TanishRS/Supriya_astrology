<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070617" />

    <title>Astrologer Supriya — Astrology, Tarot, Numerology, Vastu, Reiki, Akashic Records</title>
    <meta
      name="description"
      content="Clarity on health, wealth, relationships & career with Supriya — Astrology, Tarot, Numerology, Vastu, Reiki, Akashic Record Reading and Inner Child Healing. Book a consultation on WhatsApp."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Astrologer Supriya — Astrology, Tarot, Numerology, Vastu, Reiki, Akashic Records" />
    <meta
      property="og:description"
      content="Clarity on health, wealth, relationships & career through ancient wisdom. Book a consultation with Supriya."
    />
    <!-- Absolute URLs on the live custom domain. These must point at a host that
         actually serves the site, or WhatsApp/Instagram link previews show no
         image at all. Note the spelling: supriyaCKirugaval. -->
    <meta property="og:url" content="https://supriyackirugaval.com" />
    <meta property="og:image" content="https://supriyackirugaval.com/supriya-portrait.jpg" />
    <meta property="og:image:alt" content="Supriya, astrology, tarot and energy healing consultant" />
    <meta name="twitter:card" content="summary" />
    <!-- Uses the portrait as the share image. [OPEN ITEM] Still no logo/brand mark
         from the client; a dedicated 1200x630 landscape banner would present better
         on WhatsApp/Instagram link previews than this square portrait. -->

    <!-- The apex, not www: www 307-redirects here, and a canonical (or an
         og:image) pointing at a redirect is the kind of thing some scrapers
         quietly refuse to follow. -->
    <link rel="canonical" href="https://supriyackirugaval.com" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Set the theme before first paint to avoid a flash of the wrong mode
      ;(function () {
        try {
          var t = localStorage.getItem('theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          document.documentElement.dataset.theme = t
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
